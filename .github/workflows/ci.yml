name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    - name: cache bazel
      uses: actions/cache@v5
      with:
        path: ~/.cache/bazel
        key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', '.bazelrc', '**/BUILD', '**/*.bzl') }}
        restore-keys: |
          bazel-${{ runner.os }}-
    - name: setup
      run: |
        sudo apt update
        sudo apt install -y libsnappy-dev mesa-common-dev libgl1-mesa-dev python3-snappy
    - name: test
      run: ./travis-ci.sh
